<div
  *ngIf="isOpen"
  class="tp-modal-overlay"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
>
  <div
    class="tp-modal-container"
    [style.maxWidth]="maxWidth"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div class="tp-modal-header">
      <div class="tp-modal-title-wrap">
        <h3 class="tp-modal-title">{{ title }}</h3>
        <p *ngIf="subtitle" class="tp-modal-subtitle">{{ subtitle }}</p>
      </div>
      <button
        type="button"
        class="tp-modal-close-btn"
        (click)="close()"
        aria-label="Fechar modal"
      >
        <tp-icon name="x" size="sm"></tp-icon>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="tp-modal-body">
      <ng-content></ng-content>
    </div>

    <!-- Modal Footer -->
    <div *ngIf="hasFooter" class="tp-modal-footer">
      <ng-content select="[tpModalFooter]"></ng-content>
    </div>
  </div>
</div>
